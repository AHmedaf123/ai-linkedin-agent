name: Daily LinkedIn Post

on:
  schedule:
    # 10:00 AM Pakistan Time (PKT = UTC+5) => 05:00 UTC.
    # NOTE: GitHub cron is best-effort and can fire a bit late under load; the
    # posting window in config.yaml (time_window_end) absorbs that delay, and
    # when_gate's once-per-day guard prevents a double post.
    - cron: '0 5 * * *'   # 10:00 PKT
  workflow_dispatch: # Allow manual run
    inputs:
      force:
        description: "Force posting regardless of schedule"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linkedin-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      AI_LINKED_INSECRETS: ${{ secrets.AI_LINKED_INSECRETS }}
      HEADLESS: true  # ✅ Force headless globally

    steps:
      # --- Always pull the latest main branch ---
      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure latest commit from origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "✅ Synced with latest commit:"
          git log -1 --oneline

      # --- Setup Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- Cache pip dependencies ---
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # --- Install dependencies ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Cache Playwright browsers ---
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # --- Load packed secrets ---
      - name: Load packed secrets
        if: ${{ env.AI_LINKED_INSECRETS != '' }}
        run: |
          python - <<'PY'
          import os, json, sys
          data = os.environ.get("AI_LINKED_INSECRETS")
          if not data:
              print("AI_LINKED_INSECRETS secret is not set.", file=sys.stderr)
              sys.exit(1)
          try:
              j = json.loads(data)
          except Exception as e:
              print(f"Invalid JSON in AI_LINKED_INSECRETS: {e}", file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in j.items():
                  print(f"{k}={v}", file=f)
          PY

      # --- Run AI Agent ---
      - name: Run AI Agent
        env:
          LINKEDIN_STORAGE_ONLY: "true"
          LINKEDIN_STORAGE_B64: ${{ secrets.LINKEDIN_STORAGE_B64 }}
          LINKEDIN_FEED_FIRST_WAIT_MS: "60000"
          LINKEDIN_LOGIN_NAV_TIMEOUT_MS: "120000"
          LINKEDIN_DEFAULT_TIMEOUT_MS: "60000"
          HEADLESS: "true"
          LOG_LEVEL_CONSOLE: "INFO"
          LOG_LEVEL_FILE: "DEBUG"
          ENABLE_POST: "true"
          ENABLE_FIRST_COMMENT: ${{ vars.ENABLE_FIRST_COMMENT || 'false' }}
        run: |
          RUN_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Manual run with force enabled."
            RUN_ARGS="--force"
          fi
          if [ "$ENABLE_POST" != "true" ]; then
            echo "Running in dry-run mode because ENABLE_POST is not 'true'"
            RUN_ARGS="$RUN_ARGS --dry-run"
          fi
          python run.py $RUN_ARGS

      # --- Upload artifacts on failure ---
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            post_preview.txt
            linkedin_agent.log
            structured_logs.json
            *_screenshot.png
            *_page.html
          if-no-files-found: ignore
          retention-days: 5

      # --- Persist state (DB + JSON) so dedup/cooldown/learning survive runs ---
      - name: Commit state changes (if any)
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          for f in agent/agent_storage.db agent/state.json agent/topic_history.json \
                   agent/niche_index.json agent/repo_queue.json agent/used_repos.json \
                   agent/metrics_history.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): persist agent state after posting run"
            git pull --rebase origin main || true
            git push
          else
            echo "No state changes to commit."
          fi
