name: Growth Session

# Opt-in engagement automation (niche comments + connection requests).
# Only runs when the repository variable ENABLE_GROWTH is set to 'true'.
# Volumes are rate-limited in agent/growth_agent.py via persistent daily
# counters. Note: this kind of automation is against LinkedIn's ToS —
# keep caps conservative and disable if the account gets warnings.

on:
  schedule:
    - cron: '30 8 * * *'  # 13:30 PKT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-growth
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_GROWTH == 'true' || github.event_name == 'workflow_dispatch' }}
    env:
      AI_LINKED_INSECRETS: ${{ secrets.AI_LINKED_INSECRETS }}
      HEADLESS: true

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Load packed secrets
        if: ${{ env.AI_LINKED_INSECRETS != '' }}
        run: |
          python - <<'PY'
          import os, json, sys
          data = os.environ.get("AI_LINKED_INSECRETS")
          if not data:
              print("AI_LINKED_INSECRETS secret is not set.", file=sys.stderr)
              sys.exit(1)
          try:
              j = json.loads(data)
          except Exception as e:
              print(f"Invalid JSON in AI_LINKED_INSECRETS: {e}", file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in j.items():
                  print(f"{k}={v}", file=f)
          PY

      - name: Run growth session
        env:
          LINKEDIN_STORAGE_ONLY: "true"
          LINKEDIN_STORAGE_B64: ${{ secrets.LINKEDIN_STORAGE_B64 }}
          HEADLESS: "true"
          ENABLE_GROWTH: "true"
          GROWTH_MAX_COMMENTS_PER_DAY: ${{ vars.GROWTH_MAX_COMMENTS_PER_DAY || '8' }}
          GROWTH_MAX_CONNECTS_PER_DAY: ${{ vars.GROWTH_MAX_CONNECTS_PER_DAY || '12' }}
        run: python run.py --growth

      - name: Commit rate-limit counters (if any)
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          [ -f agent/agent_storage.db ] && git add agent/agent_storage.db
          if ! git diff --cached --quiet; then
            git commit -m "chore(growth): update daily counters"
            git pull --rebase origin main || true
            git push
          else
            echo "No counter changes to commit."
          fi
