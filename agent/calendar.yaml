# LinkedIn Content Calendar
# Weekly seed topics for an AI/ML engineer sharing practical, hands-on lessons.
# NOTE: templates here are only a last-resort scaffold. The main flow generates
# humanized story-style posts via the LLM (see agent/llm_generator.py). These
# body_templates are deliberately plain — no emojis, no bullet scaffolding.

weekly_schedule:
  # Monday: Agents & agentic workflows
  0:
    primary_topic: "Building Agentic Workflows with Claude"
    subtopics:
      - "Tool use and function calling"
      - "Multi-step agent loops"
      - "When an agent should stop"
      - "Giving agents memory"
    post_type: "lesson"
    series_length: 4

  # Tuesday: LLM API implementation details
  1:
    primary_topic: "AI API Implementation Details"
    subtopics:
      - "Handling rate limits and retries"
      - "Cost optimization tricks"
      - "Streaming and latency"
      - "Structured output that does not break"
    post_type: "lesson"
    series_length: 4

  # Wednesday: RAG & retrieval
  2:
    primary_topic: "RAG Pipelines in Production"
    subtopics:
      - "Chunking mistakes juniors make"
      - "When retrieval hurts more than helps"
      - "Evaluating retrieval quality"
      - "Keeping context small"
    post_type: "lesson"
    series_length: 4

  # Thursday: Prompt engineering
  3:
    primary_topic: "Prompt Engineering Patterns Juniors Miss"
    subtopics:
      - "Why examples beat instructions"
      - "Controlling output format"
      - "Reducing hallucination"
      - "Prompting for tool use"
    post_type: "lesson"
    series_length: 4

  # Friday: Reliability & production patterns
  4:
    primary_topic: "Production Patterns Tutorials Skip"
    subtopics:
      - "Error handling around AI APIs"
      - "Evaluating LLM output automatically"
      - "Caching to cut cost"
      - "Debugging nondeterministic behavior"
    post_type: "lesson"
    series_length: 4

  # Saturday: Personal engineering lessons
  5:
    primary_topic: "Things I Learned Building AI Products"
    subtopics:
      - "A bug that taught me something"
      - "A tool that changed my workflow"
      - "A mistake I kept repeating"
      - "Something I wish I knew earlier"
    post_type: "story"
    series_length: 4

  # Sunday: Model & tooling choices
  6:
    primary_topic: "Choosing Models and Tools"
    subtopics:
      - "When to fine-tune vs prompt"
      - "Picking the right model for the job"
      - "Cost vs quality trade-offs"
      - "Context window management"
    post_type: "lesson"
    series_length: 4

# Plain fallback scaffolds only (the LLM path is preferred and humanized).
post_templates:
  lesson:
    title_template: "{subtopic}"
    body_template: |
      Something about {subtopic} that took me a while to figure out.

      {hashtags}

  story:
    title_template: "{subtopic}"
    body_template: |
      A short story about {subtopic} from my own work.

      {hashtags}
